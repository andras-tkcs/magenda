name: Build & Release MCPB

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  build:
    runs-on: macos-latest   # arm64 Apple Silicon runner
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # assets/compiled/ (chrome.pdf + slots.json) is a committed build
      # artifact, regenerated by hand via scripts/compile_template.py --
      # never here, since that needs a local LibreOffice install (see
      # README.md's "Compiling the template"). This just catches the case
      # where assets/template.docx was edited without recompiling: no
      # LibreOffice needed for the check itself, just a hash comparison.
      - name: Verify assets/compiled/ matches assets/template.docx
        run: |
          expected="$(cat assets/compiled/template.docx.sha256 | cut -d' ' -f1)"
          actual="$(shasum -a 256 assets/template.docx | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::assets/template.docx has changed since assets/compiled/ was last generated." \
                 "Run 'python scripts/compile_template.py' and commit its output."
            exit 1
          fi

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      # ── Optional: import Developer ID certificate for signing ─────────────
      # To enable signing of the bundled executable:
      #   1. Export your "Developer ID Application" cert from Keychain as a .p12
      #   2. Add these GitHub secrets:
      #        MACOS_CERTIFICATE      — base64-encoded .p12  (cat cert.p12 | base64 | pbcopy)
      #        MACOS_CERTIFICATE_PWD  — the .p12 export password
      #        SIGN_IDENTITY          — e.g. "Developer ID Application: Your Name (TEAMID)"
      #   3. Uncomment the block below
      #
      # - name: Import signing certificate
      #   env:
      #     MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      #     MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      #   run: |
      #     echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
      #     security create-keychain -p "" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "" build.keychain
      #     security import certificate.p12 -k build.keychain \
      #       -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s \
      #       -k "" build.keychain
      #     rm certificate.p12

      - name: Build .mcpb
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: bash scripts/build_mcpb.sh

      - name: Upload MCPB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magenda-mcpb
          path: dist/Magenda-*.mcpb
          retention-days: 30

      # Attach to the GitHub Release when triggered by a version tag
      - name: Attach MCPB to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Magenda-*.mcpb
